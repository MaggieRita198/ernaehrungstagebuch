</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">MEIN ERNÄHRUNGSTAGEBUCH</div><h1 id="heading">Heute</h1></div><span class="pill">● Offline</span></header><div id="app"></div></main><nav class="nav" id="nav"></nav><input id="photoFile" type="file" accept="image/*" class="hidden"><input id="cameraFile" type="file" accept="image/*" capture="environment" class="hidden"><script>

const FOOD=[['Granny Smith','Obst',52,0.3,'Basis'],['Apfel','Obst',52,.3,'Basis'],['Erdbeeren','Obst',32,.7,'Erweitert'],['Heidelbeeren','Obst',57,.7,'Erweitert'],['Himbeeren','Obst',43,1.2,'Erweitert'],['Brokkoli','Gemüse',34,2.8,'Basis'],['Blumenkohl','Gemüse',25,1.9,'Basis'],['Tomate','Gemüse',18,.9,'Basis'],['Gurke','Gemüse',12,.6,'Basis'],['Spinat','Gemüse',23,2.9,'Basis'],['Fenchel','Gemüse',31,1.2,'Basis'],['Pak Choi','Gemüse',13,1.5,'Erweitert'],['Kohlrabi','Gemüse',27,1.7,'Basis'],['Radieschen','Gemüse',16,.7,'Basis'],['Weißkohl','Gemüse',25,1.3,'Basis'],['Lauch','Gemüse',61,1.5,'Erweitert'],['Blattsalat','Gemüse',15,1.4,'Basis'],['Zucchini','Gemüse',17,1.2,'Basis'],['Paprika','Gemüse',31,1,'Erweitert'],['Kabeljau','Fisch',82,17.8,'Basis'],['Schellfisch','Fisch',74,16.3,'Basis'],['Garnelen','Fisch',85,20,'Basis'],['Seelachs','Fisch',79,17,'Erweitert'],['Magerquark','Milchprodukte',67,12,'Erweitert'],['Naturjoghurt 1,5 %','Milchprodukte',47,4,'Erweitert'],['Hüttenkäse, fettarm','Milchprodukte',72,12,'Erweitert'],['Naturtofu','Vegetarisch',125,13,'Erweitert'],['Seidentofu','Vegetarisch',55,5,'Erweitert'],['Ei','Vegetarisch',143,12.6,'Erweitert'],['Eiklar','Vegetarisch',46,11,'Erweitert'],['Rindfleisch, mager','Fleisch',120,22,'Erweitert'],['Kalbfleisch, mager','Fleisch',110,21,'Erweitert'],['Tee, ungesüßt','Getränke',0,0,'Basis'],['Kaffee, schwarz','Getränke',1,0,'Basis'],['Espresso, schwarz','Getränke',2,0,'Basis'],['Matcha, Pulver','Getränke',324,30,'Erweitert'],['Wasser','Getränke',0,0,'Basis']].map((a,i)=>({id:'f'+i,name:a[0],cat:a[1],k:a[2],p:a[3],phase:a[4]}));
const KEY='privates_ernaehrungstagebuch_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};db ||= {foods:[],meals:[],water:[],weights:[],settings:{min:1400,max:1700,water:2000,goal:60,next:76,starting:80},dayTargets:{},milestones:[],photos:[]};for(const k of ['foods','meals','water','weights','photos','milestones'])db[k] ||= [];db.dayTargets ||= {};db.settings ||= {min:1400,max:1700,water:2000,goal:60,next:76,starting:80};
let tab='Heute',editing=null,cat='Alle',search='',selectedFood='',chosenDay='',period='Woche',selectedMetric='all',photoSelection=[null,null],mealDraft={category:'Mittagessen',time:clock(),date:today(),items:[]};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const fmt=(n,d=0)=>Number(n||0).toLocaleString('de-DE',{maximumFractionDigits:d});function today(){return localDate(new Date())}function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function clock(){return new Date().toTimeString().slice(0,5)}function allFoods(){return [...FOOD,...db.foods]}function food(id){return allFoods().find(x=>x.id===id)}function kcal(items){return items.reduce((s,x)=>s+(food(x.id)?.k||0)*Number(x.g||0)/100,0)}function dayMeals(d){return db.meals.filter(m=>m.date===d)}function dayKcal(d){return dayMeals(d).reduce((s,m)=>s+kcal(m.items),0)}function dayWater(d){return db.water.filter(w=>w.date===d).reduce((s,w)=>s+w.ml,0)+dayMeals(d).filter(m=>m.category==='Tee').reduce((s,m)=>s+m.items.filter(x=>food(x.id)?.name==='Tee, ungesüßt').reduce((a,x)=>a+Number(x.g),0),0)}function targets(d){return db.dayTargets[d]||{min:db.settings.min,max:db.settings.max}}function setTargets(d,min,max){db.dayTargets[d]={min,max};save()}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Speichern fehlgeschlagen: Gerätespeicher voll oder privater Modus.')}}function setTab(t){tab=t;render()}function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}function startOfDay(d){return new Date(d+'T00:00:00').getTime()}function isoDateTime(d,t){return new Date(d+'T'+t+':00').getTime()}function foodOptions(){return allFoods().map(f=>`<option value="${esc(f.id)}">${esc(f.name)} · ${fmt(f.k)} kcal/100 g</option>`).join('')}function input(label,id,val,type='text',extra=''){return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`}function status(d){let n=dayKcal(d),t=targets(d);return d===today()?'off':n<t.min||n>t.max?'red':'green'}
function render(){const names={Heute:'Heute',Mahlzeit:'Mahlzeit erfassen',Lebensmittel:'Lebensmittel',Verlauf:'Verlauf',Tagebuch:'Tagebuch',Einstellungen:'Einstellungen'};$('heading').textContent=names[tab];$('nav').innerHTML=[['Heute','⌂'],['Mahlzeit','♜'],['Lebensmittel','▤'],['Verlauf','⌁'],['Tagebuch','▣']].map(([n,i])=>`<button class="${tab===n?'active':''}" data-tab="${n}"><b>${i}</b>${n}</button>`).join('');$('app').innerHTML=({Heute:renderHome,Mahlzeit:renderMeal,Lebensmittel:renderFoods,Verlauf:renderHistory,Tagebuch:renderDiary,Einstellungen:renderSettings}[tab])();$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));bind();}
function renderHome(){const d=today(),n=dayKcal(d),t=targets(d),w=dayWater(d),latest=[...db.weights].sort((a,b)=>b.date.localeCompare(a.date))[0],fast=fastingRecords().filter(f=>f.endDate===d).at(-1);return `<div class="card"><div class="row"><h2>Kalorien heute</h2><span class="small">Ziel ${fmt(t.min)}–${fmt(t.max)} kcal</span></div><div class="num">${fmt(n)} <span class="small">kcal</span></div><div class="progress"><div class="${n>t.max?'red':''}" style="width:${Math.min(100,n/t.max*100)}%"></div></div><div class="row"><span class="muted">Noch verfügbar</span><strong class="${n>t.max?'red':'green'}">${fmt(Math.max(0,t.max-n))} kcal</strong></div><p class="small">Der aktuelle Tag wird erst nach Tagesabschluss bewertet.</p></div><div class="cols"><div class="card"><div class="small">Flüssigkeit</div><div class="num-sm">${fmt(w)} ml</div><div class="small">von ${fmt(db.settings.water)} ml</div><button class="secondary" data-water="250" style="margin-top:10px;width:100%">+ 250 ml</button></div><div class="card"><div class="small">Gewicht</div><div class="num-sm">${latest?fmt(latest.kg,1)+' kg':'–'}</div><div class="small">Nächstes Ziel: ${fmt(db.settings.next,1)} kg</div><button class="secondary" data-tab2="Tagebuch" style="margin-top:10px;width:100%">Eintragen</button></div></div><div class="card"><h2>Fastenphase</h2><div class="num-sm">${fast?durationLabel(fast.hours):'Noch keine abgeschlossene Phase'}</div><p class="small">Automatisch zwischen letzter und erster fastenbrechender Aufnahme; kein Fastenziel.</p></div><div class="card"><div class="row"><h2>Heutige Einträge</h2><button data-tab2="Mahlzeit">+ Neu</button></div>${dayMeals(d).sort((a,b)=>a.time.localeCompare(b.time)).map(m=>`<div class="item row"><div><strong>${esc(m.time)} · ${esc(m.category)}</strong><div class="small">${m.items.map(x=>food(x.id)?.name||'Unbekannt').join(', ')}</div></div><div><strong>${fmt(kcal(m.items))} kcal</strong><button class="ghost" data-edit="${m.id}">✎</button></div></div>`).join('')||'<p class="muted">Noch keine Einträge.</p>'}</div><button class="secondary" data-tab2="Einstellungen">⚙ Einstellungen</button>`}
function renderMeal(){let n=dayKcal(mealDraft.date)-(editing? kcal(db.meals.find(m=>m.id===editing)?.items||[]):0),mk=kcal(mealDraft.items),t=targets(mealDraft.date),after=n+mk;return `<div class="card"><h2>${editing?'Eintrag bearbeiten':'Neuen Eintrag erstellen'}</h2><div class="fieldrow">${input('Datum','mealDate',mealDraft.date,'date')}${input('Uhrzeit','mealTime',mealDraft.time,'time')}</div><div style="margin-top:12px"><label>Kategorie</label><select id="mealCategory">${['Frühstück','Mittagessen','Abendessen','Snack','Tee','Kaffee','Espresso','Matcha'].map(x=>`<option ${x===mealDraft.category?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="card"><h2>Kalorienbudget – Live</h2><div class="cols3"><div><div class="small">Bereits</div><div class="num-sm">${fmt(n)}</div><div class="small">kcal</div></div><div><div class="small">Mahlzeit</div><div class="num-sm">+${fmt(mk)}</div><div class="small">kcal</div></div><div><div class="small">Verfügbar</div><div class="num-sm ${after>t.max?'red':after>=t.min?'green':''}">${fmt(Math.max(0,t.max-after))}</div><div class="small">kcal</div></div></div><div class="progress"><div class="${after>t.max?'red':''}" style="width:${Math.min(100,after/t.max*100)}%"></div></div><div class="${after>t.max?'red':after>=t.min?'green':'muted'}">${after>t.max?fmt(after-t.max)+' kcal über dem Maximum':after>=t.min?'Im Zielbereich':'Noch '+fmt(t.min-after)+' kcal bis zum Zielbereich'}</div></div><div class="card"><div class="row"><h2>Zutatenliste</h2><span class="small">${mealDraft.items.length} Zutaten</span></div>${mealDraft.items.map((it,i)=>`<div class="item row"><div style="flex:1"><strong>${esc(food(it.id)?.name||'Unbekannt')}</strong><div class="small">${fmt(food(it.id)?.k||0)} kcal/100 g</div></div><div style="width:85px"><input aria-label="Menge in g oder ml" type="number" min="0" step="any" data-qty="${i}" value="${it.g}"></div><strong>${fmt((food(it.id)?.k||0)*it.g/100)}</strong><button class="ghost danger" data-delitem="${i}">×</button></div>`).join('')||'<p class="small">Füge unten Lebensmittel hinzu.</p>'}<div class="item"><label>Lebensmittel hinzufügen</label><select id="foodSelect">${foodOptions()}</select><div class="fieldrow" style="margin-top:10px"><input id="foodQty" type="number" min="0.1" step="any" value="100" aria-label="Menge in Gramm oder Milliliter"><button id="addFood">+ Hinzufügen</button></div></div><div class="row" style="margin-top:12px"><strong>Gesamt</strong><span class="num-sm">${fmt(mk)} kcal</span></div><button id="saveMeal" style="width:100%;margin-top:15px">${editing?'Änderungen speichern':'Eintrag speichern'}</button>${editing?'<button id="cancelEdit" class="secondary" style="width:100%;margin-top:8px">Abbrechen</button>':''}</div><p class="small">Nur Tee zählt automatisch zum Flüssigkeitstracker. Matcha unterbricht die Fastenphase, schwarzer Kaffee und Espresso ohne Zusätze nicht.</p>`}
function renderFoods(){let f=allFoods().filter(x=>(cat==='Alle'||x.cat===cat||(cat==='Eigene'&&x.phase==='Selbst hinzugefügt'))&&x.name.toLocaleLowerCase('de').includes(search.toLocaleLowerCase('de')));return `<div class="card"><input id="search" placeholder="Lebensmittel suchen …" value="${esc(search)}" aria-label="Suche"><div class="chipbar" style="margin-top:12px">${['Alle','Gemüse','Obst','Fisch','Milchprodukte','Vegetarisch','Fleisch','Getränke','Eigene'].map(c=>`<button class="${cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div><p class="small">${f.length} Lebensmittel · Angaben je 100 g (bei Getränken näherungsweise je 100 ml). Status und Nährwerte sind Orientierungswerte, keine medizinisch geprüfte Freigabeliste.</p>${f.map(x=>`<div class="item row"><div style="flex:1"><strong>${esc(x.name)}</strong><div class="small">${esc(x.cat)} · ${esc(x.phase)}</div></div><div style="text-align:right"><strong>${fmt(x.k)} kcal</strong><div class="small">${fmt(x.p,1)} g Protein</div></div><button class="secondary" data-pickfood="${esc(x.id)}">+</button></div>`).join('')||'<p>Keine Treffer</p>'}</div><div class="card"><h2>Eigenes Lebensmittel anlegen</h2><div class="stack">${input('Name','newName','','text')}${input('Kategorie','newCat','Eigene')}${input('Kalorien je 100 g','newK','0','number')}${input('Protein je 100 g','newP','0','number')}<button id="newFood">Lebensmittel speichern</button></div></div>`}
function daysInPeriod(){let end=new Date(today()+'T12:00:00'),count=period==='Woche'?7:period==='Monat'?30:period==='3 Monate'?90:period==='Jahr'?365:Math.min(730,Math.max(30,Math.round((end-new Date(Math.min(...[...db.meals.map(x=>startOfDay(x.date)),...db.weights.map(x=>startOfDay(x.date)),end.getTime()])))/86400000)+1));return Array.from({length:count},(_,i)=>{let d=new Date(end);d.setDate(d.getDate()-count+1+i);return localDate(d)})}
function fastingRecords(){let events=[];for(const m of db.meals){if(!m.items?.length)continue;let hasBreak=m.items.some(it=>{let f=food(it.id);if(!f)return false;if(f.name==='Wasser'||f.name==='Tee, ungesüßt'||f.name==='Kaffee, schwarz'||f.name==='Espresso, schwarz')return false;return (Number(it.g)>0)});if(hasBreak)events.push({t:isoDateTime(m.date,m.time),date:m.date})}events.sort((a,b)=>a.t-b.t);let out=[];for(let i=1;i<events.length;i++){let hours=(events[i].t-events[i-1].t)/3600000;if(events[i].date!==events[i-1].date&&hours>=4&&hours<=48)out.push({start:events[i-1].t,end:events[i].t,endDate:events[i].date,hours})}return out}
function durationLabel(h){return Math.floor(h)+' Std. '+Math.round((h%1)*60)+' Min.'}function renderHistory(){const days=daysInPeriod(),fasts=fastingRecords(),weights=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date));let points=days.map(d=>({d,k:dayMeals(d).length?dayKcal(d):null,water:db.water.some(w=>w.date===d)||dayMeals(d).some(m=>m.category==='Tee')?dayWater(d):null,w:weights.filter(w=>w.date<=d).at(-1)?.kg??null,fast:fasts.filter(f=>f.endDate===d).at(-1)?.hours??null}));let selected=chosenDay||days.at(-1);if(!days.includes(selected))selected=days.at(-1);let p=points.find(x=>x.d===selected);const series=[['w','Gewicht','kg','#45d18d'],['k','Kalorien','kcal','#ffac5b'],['water','Wasser','ml','#5aa9ff'],['fast','Fastendauer','Std.','#bd8bff']];let W=640,H=260,left=15,right=625,top=15,bottom=225;let lines=series.filter(s=>selectedMetric==='all'||selectedMetric===s[0]).map(s=>{let vals=points.map(q=>q[s[0]]).filter(v=>v!==null),lo=Math.min(...vals),hi=Math.max(...vals);if(!vals.length)return '';if(hi===lo){lo-=1;hi+=1}let coord=(v,i)=>[(left+i*(right-left)/Math.max(1,points.length-1)),bottom-(v-lo)/(hi-lo)*(bottom-top)];let path='',last=false;points.forEach((q,i)=>{if(q[s[0]]===null){last=false;return}let [x,y]=coord(q[s[0]],i);path+=(last?'L':'M')+x.toFixed(1)+','+y.toFixed(1)+' ';last=true});let dots=points.map((q,i)=>q[s[0]]===null?'':(()=>{let [x,y]=coord(q[s[0]],i);return `<circle cx="${x}" cy="${y}" r="${q.d===selected?5:3}" fill="${s[3]}"/>`})()).join('');return `<path d="${path}" stroke="${s[3]}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${dots}`}).join('');let chosenIdx=days.indexOf(selected);return `<div class="card"><div class="chipbar">${['Woche','Monat','3 Monate','Jahr','Gesamt'].map(x=>`<button class="${period===x?'on':''}" data-period="${x}">${x}</button>`).join('')}</div><h2 style="margin-top:17px">Gewicht · Kalorien · Wasser · Fastendauer</h2><div class="chipbar">${[['all','Alle','#fff'],...series.map(x=>[x[0],x[1],x[3]])].map(s=>`<button class="${selectedMetric===s[0]?'on':''}" data-metric="${s[0]}"><span class="dot" style="background:${s[2]}"></span>${s[1]}</button>`).join('')}</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlaufsgrafik mit Zeitachse. Datum unten auswählen, um Werte zu sehen.">${[45,100,155,210].map(y=>`<line x1="${left}" x2="${right}" y1="${y}" y2="${y}" stroke="#314053" stroke-dasharray="4 6"/>`).join('')}<line x1="${left+chosenIdx*(right-left)/Math.max(1,days.length-1)}" x2="${left+chosenIdx*(right-left)/Math.max(1,days.length-1)}" y1="${top}" y2="${bottom}" stroke="#8d9cb2" stroke-dasharray="4 5"/>${lines}${days.filter((_,i)=>i%Math.max(1,Math.ceil(days.length/7))===0||i===days.length-1).map(d=>`<text x="${left+days.indexOf(d)*(right-left)/Math.max(1,days.length-1)}" y="250" text-anchor="middle" font-size="12" fill="#aebcd0">${esc(d.slice(8)+'.'+d.slice(5,7)+'.')}</text>`).join('')}</svg><div class="fieldrow"><div><label>Messpunkt auswählen</label><input id="selectedDay" type="date" value="${selected}" min="${days[0]}" max="${days.at(-1)}"></div><div><label>Auf Zeitachse verschieben</label><input id="daySlider" type="range" min="0" max="${days.length-1}" value="${chosenIdx}" style="margin-top:6px"></div></div><div class="card" style="background:var(--panel2);margin-top:14px;margin-bottom:0"><strong>${dateLabel(selected)}</strong><div class="cols" style="margin-top:12px">${series.filter(s=>selectedMetric==='all'||selectedMetric===s[0]).map(s=>`<div><div class="small"><span class="dot" style="background:${s[3]}"></span>${s[1]}</div><div class="num-sm">${p[s[0]]===null?'–':fmt(p[s[0]],1)+' '+s[2]}</div></div>`).join('')}</div></div><p class="small">Vier separat normalisierte Kurven ohne sichtbare Y-Skalen. Fehlende Werte werden nicht erfunden. Tippe auf die Grafik oder wähle ein Datum, um Messwerte abzulesen.</p></div><div class="card"><h2>Fastenphasen (ohne Zielvorgabe)</h2>${fasts.slice(-12).reverse().map(f=>`<div class="item row"><span>${dateLabel(f.endDate)}</span><strong>${durationLabel(f.hours)}</strong></div>`).join('')||'<p class="muted">Noch keine zwei aufeinanderfolgenden kalorienhaltigen Einträge mit Uhrzeit vorhanden.</p>'}</div><div class="card"><h2>Kalorienampel</h2><div class="cols3">${days.slice(-9).map(d=>`<div class="row"><span class="small">${d.slice(5)}</span><span class="dot" style="background:${status(d)==='green'?'var(--green)':status(d)==='red'?'var(--red)':'#74869b'}"></span></div>`).join('')}</div><p class="small">Grün = innerhalb des gespeicherten Tagesbereichs, Rot = außerhalb, Grau = heutiger noch nicht abgeschlossener Tag.</p></div>`}
function renderDiary(){let weights=[...db.weights].sort((a,b)=>b.date.localeCompare(a.date)),latest=weights[0],photos=[...db.photos].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="card"><h2>Gewicht und Notiz zum Vortag</h2><div class="cols">${input('Datum','weightDate',today(),'date')}${input('Gewicht (kg)','weightKg',latest?.kg||'','number','step="0.1" min="1"')}</div><div style="margin-top:12px"><label>Notiz zum Vortag</label><textarea id="weightNote" rows="3" placeholder="Wie lief der Vortag?"></textarea></div><button id="saveWeight" style="margin-top:10px">Gewicht speichern</button><div class="item"><div class="small">Nächstes Zwischenziel</div><strong>${fmt(db.settings.next,1)} kg</strong><span class="small"> · Langfristig ${fmt(db.settings.goal,1)} kg</span></div>${weights.slice(0,12).map(w=>`<div class="item row"><div><strong>${dateLabel(w.date)} · ${fmt(w.kg,1)} kg</strong><div class="small">${esc(w.note||'')}</div></div><button class="ghost" data-weightedit="${esc(w.date)}">✎</button></div>`).join('')}</div><div class="card"><h2>Fototagebuch</h2><p class="small">Beim Öffnen: erste und letzte Aufnahme. Fotos werden lokal im privaten Browser-Speicher abgelegt.</p><div class="photos"><figure><figcaption>Erste Aufnahme</figcaption><img id="firstPhoto" class="photo" alt="Erste Fortschrittsaufnahme"></figure><figure><figcaption>Neueste Aufnahme</figcaption><img id="lastPhoto" class="photo" alt="Neueste Fortschrittsaufnahme"></figure></div><div class="cols" style="margin-top:12px"><button id="camera">Kamera öffnen</button><button class="secondary" id="gallery">Foto auswählen</button></div><div class="fieldrow" style="margin-top:12px"><div><label>Linkes Vergleichsbild</label><select id="photoLeft"><option value="">Erste Aufnahme</option>${photos.map(p=>`<option value="${p.id}" ${photoSelection[0]===p.id?'selected':''}>${esc(p.date)} ${esc(p.time)}</option>`).join('')}</select></div><div><label>Rechtes Vergleichsbild</label><select id="photoRight"><option value="">Neueste Aufnahme</option>${photos.map(p=>`<option value="${p.id}" ${photoSelection[1]===p.id?'selected':''}>${esc(p.date)} ${esc(p.time)}</option>`).join('')}</select></div></div>${photos.slice().reverse().map(p=>`<div class="item row"><span>${esc(p.date)} · ${esc(p.time)}</span><button class="ghost danger" data-deletephoto="${p.id}">Löschen</button></div>`).join('')}</div>`}
function renderSettings(){let s=db.settings,t=targets(today());return `<div class="card"><h2>Kalorienziel</h2><p class="small">Der heutige Zielbereich wird für dieses Datum gespeichert. Bereits gespeicherte Tage behalten ihre Grenzen.</p><div class="fieldrow">${input('Minimum heute (kcal)','minToday',t.min,'number')}${input('Maximum heute (kcal)','maxToday',t.max,'number')}</div><button id="saveTargets" style="margin-top:12px">Tagesziel speichern</button></div><div class="card"><h2>Persönliche Einstellungen</h2><div class="stack">${input('Flüssigkeitsziel (ml)','waterGoal',s.water,'number')}${input('Langfristiges Gewichtsziel (kg)','goal',s.goal,'number','step="0.1"')}${input('Nächstes Zwischenziel (kg)','nextGoal',s.next,'number','step="0.1"')}${input('Ausgangsgewicht (kg)','starting',s.starting,'number','step="0.1"')}<button id="saveSettings">Einstellungen speichern</button></div></div><div class="card"><h2>Datenschutz und Speicherung</h2><div class="notice">Diese Einzeldatei enthält keine Internetaufrufe, Cloud-Funktionen, Tracker oder externe Bibliotheken. Daten werden lokal im Browserprofil gespeichert; Fotos im lokalen IndexedDB-Speicher.</div><p class="small">Wichtig: Eine HTML-App kann den Browser oder das Betriebssystem nicht technisch vom Internet abschotten, lokale Daten nicht garantiert verschlüsseln und System-Backups nicht unterbinden. Für diese Sicherheitsgarantien ist eine native App mit privatem verschlüsseltem Speicher erforderlich. Löschen von Browserdaten oder Nutzung eines privaten Fensters kann alle Einträge entfernen.</p><button class="secondary danger" id="wipe">Alle lokalen App-Daten löschen</button></div>`}
function bind(){document.querySelectorAll('[data-tab2]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab2));document.querySelectorAll('[data-water]').forEach(b=>b.onclick=()=>{db.water.push({id:uid(),date:today(),ml:+b.dataset.water});save();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let m=db.meals.find(x=>x.id===b.dataset.edit);editing=m.id;mealDraft=structuredClone({date:m.date,time:m.time,category:m.category,items:m.items});setTab('Mahlzeit')});if(tab==='Mahlzeit')bindMeal();if(tab==='Lebensmittel')bindFoods();if(tab==='Verlauf')bindHistory();if(tab==='Tagebuch')bindDiary();if(tab==='Einstellungen')bindSettings()}
function bindMeal(){for(const [id,key] of [['mealDate','date'],['mealTime','time'],['mealCategory','category']])$(id).onchange=e=>{mealDraft[key]=e.target.value;if(key==='category'&&['Tee','Kaffee','Espresso','Matcha'].includes(mealDraft.category)&&!mealDraft.items.length){let f=allFoods().find(f=>f.name.startsWith(mealDraft.category));if(f)mealDraft.items=[{id:f.id,g:mealDraft.category==='Espresso'?30:mealDraft.category==='Matcha'?2:250}]};render()};document.querySelectorAll('[data-qty]').forEach(b=>b.onchange=()=>{mealDraft.items[+b.dataset.qty].g=Math.max(0,+b.value);render()});document.querySelectorAll('[data-delitem]').forEach(b=>b.onclick=()=>{mealDraft.items.splice(+b.dataset.delitem,1);render()});$('addFood').onclick=()=>{let g=+$('foodQty').value;if(!(g>0))return alert('Bitte eine gültige Menge angeben.');mealDraft.items.push({id:$('foodSelect').value,g});render()};$('saveMeal').onclick=()=>{if(!mealDraft.date||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(mealDraft.time)||!mealDraft.items.length||mealDraft.items.some(x=>!(x.g>0)))return alert('Bitte Datum, Uhrzeit und gültige Zutaten eintragen.');if(editing){let idx=db.meals.findIndex(m=>m.id===editing);db.meals[idx]={id:editing,...structuredClone(mealDraft)}}else db.meals.push({id:uid(),...structuredClone(mealDraft)});if(!db.dayTargets[mealDraft.date])db.dayTargets[mealDraft.date]={...targets(mealDraft.date)};editing=null;mealDraft={category:'Mittagessen',time:clock(),date:today(),items:[]};save();setTab('Heute')};if($('cancelEdit'))$('cancelEdit').onclick=()=>{editing=null;mealDraft={category:'Mittagessen',time:clock(),date:today(),items:[]};setTab('Heute')}}
function bindFoods(){$('search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});document.querySelectorAll('[data-pickfood]').forEach(b=>b.onclick=()=>{mealDraft.items.push({id:b.dataset.pickfood,g:100});setTab('Mahlzeit')});$('newFood').onclick=()=>{let name=$('newName').value.trim(),k=+$('newK').value,p=+$('newP').value;if(!name||k<0||p<0||!Number.isFinite(k)||!Number.isFinite(p))return alert('Bitte gültige Angaben machen.');db.foods.push({id:uid(),name,cat:$('newCat').value.trim()||'Eigene',k,p,phase:'Selbst hinzugefügt'});save();render()}}
function bindHistory(){document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;chosenDay='';render()});document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{selectedMetric=b.dataset.metric;render()});$('selectedDay').onchange=e=>{chosenDay=e.target.value;render()};$('daySlider').oninput=e=>{chosenDay=daysInPeriod()[+e.target.value];render()};let svg=document.querySelector('.chart');svg.onclick=e=>{let r=svg.getBoundingClientRect(),pos=(e.clientX-r.left)/r.width,days=daysInPeriod();chosenDay=days[Math.max(0,Math.min(days.length-1,Math.round((pos*640-15)/610*(days.length-1))))];render()}}
function bindDiary(){$('saveWeight').onclick=()=>{let d=$('weightDate').value,kg=+$('weightKg').value,note=$('weightNote').value;if(!d||!(kg>0))return alert('Bitte Datum und Gewicht eingeben.');db.weights=db.weights.filter(x=>x.date!==d);db.weights.push({date:d,kg,note});if(kg<=db.settings.next&&!db.milestones.some(x=>x.goal===db.settings.next))db.milestones.push({goal:db.settings.next,date:d});save();render()};document.querySelectorAll('[data-weightedit]').forEach(b=>b.onclick=()=>{let w=db.weights.find(x=>x.date===b.dataset.weightedit);$('weightDate').value=w.date;$('weightKg').value=w.kg;$('weightNote').value=w.note||'';window.scrollTo({top:0,behavior:'smooth'})});$('camera').onclick=()=>$('cameraFile').click();$('gallery').onclick=()=>$('photoFile').click();$('photoLeft').onchange=e=>{photoSelection[0]=e.target.value||null;showPhotos()};$('photoRight').onchange=e=>{photoSelection[1]=e.target.value||null;showPhotos()};document.querySelectorAll('[data-deletephoto]').forEach(b=>b.onclick=async()=>{if(!confirm('Foto endgültig löschen?'))return;await deletePhoto(b.dataset.deletephoto);db.photos=db.photos.filter(p=>p.id!==b.dataset.deletephoto);save();render()});showPhotos()}
function bindSettings(){$('saveTargets').onclick=()=>{let min=+$('minToday').value,max=+$('maxToday').value;if(min<0||max<=min)return alert('Das Maximum muss größer als das Minimum sein.');db.settings.min=min;db.settings.max=max;setTargets(today(),min,max);render()};$('saveSettings').onclick=()=>{for(const [key,id] of [['water','waterGoal'],['goal','goal'],['next','nextGoal'],['starting','starting']]){let n=+$(id).value;if(!(n>0))return alert('Bitte gültige Werte eintragen.');db.settings[key]=n}save();render()};$('wipe').onclick=async()=>{if(!confirm('Wirklich alle Einträge und Fotos unwiderruflich löschen?'))return;localStorage.removeItem(KEY);if(photoDb){let tx=photoDb.transaction('photos','readwrite');tx.objectStore('photos').clear()}location.reload()}}
let photoDb=null;function openPhotoDB(){return new Promise(resolve=>{if(!indexedDB)return resolve(null);let r=indexedDB.open('ernaehrung_private_fotos_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>{photoDb=r.result;resolve(photoDb)};r.onerror=()=>resolve(null)})}function photoAction(method,id,blob){return new Promise(resolve=>{if(!photoDb)return resolve(null);let tx=photoDb.transaction('photos',method==='get'?'readonly':'readwrite'),store=tx.objectStore('photos'),req=method==='put'?store.put(blob,id):method==='delete'?store.delete(id):store.get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)})}const deletePhoto=id=>photoAction('delete',id);let photoUrls=[];async function showPhotos(){photoUrls.forEach(URL.revokeObjectURL);photoUrls=[];let ps=[...db.photos].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));for(const [el,p] of [['firstPhoto',ps.find(x=>x.id===(photoSelection[0]||ps[0]?.id))],['lastPhoto',ps.find(x=>x.id===(photoSelection[1]||ps.at(-1)?.id))]]){let img=$(el);if(!img)continue;img.removeAttribute('src');if(p){let blob=await photoAction('get',p.id);if(blob){let url=URL.createObjectURL(blob);photoUrls.push(url);img.src=url}}}}async function acceptPhoto(file){if(!file||!file.type.startsWith('image/'))return;let id=uid(),ok=await photoAction('put',id,file);if(!photoDb)return alert('Lokaler Fotospeicher nicht verfügbar.');db.photos.push({id,date:today(),time:clock()});save();if(tab==='Tagebuch')render()}
$('photoFile').onchange=e=>{acceptPhoto(e.target.files[0]);e.target.value=''};$('cameraFile').onchange=e=>{acceptPhoto(e.target.files[0]);e.target.value=''};openPhotoDB().then(render);if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
